name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Apply Swift compatibility patch
        run: python3 ./scripts/patch_package.py

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive .app
        run: |
          xcodebuild \
            -scheme WangJinTool \
            -project WangJinTool.xcodeproj \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ${{ runner.temp }}/WangJinTool.xcarchive \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create Payload and Pack IPA
        run: |
          mkdir -p ${{ runner.temp }}/Payload
          cp -R ${{ runner.temp }}/WangJinTool.xcarchive/Products/Applications/WangJinTool.app ${{ runner.temp }}/Payload/
          cd ${{ runner.temp }}
          zip -r WangJinTool-Unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WangJinTool-Unsigned.ipa
          path: ${{ runner.temp }}/WangJinTool-Unsigned.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "WangJin Tool iOS Unsigned IPA (Build ${{ github.run_number }})"
          body: |
            ### 🛠️ WangJin Tool iOS (Unsigned IPA)
            Native iOS app-data container browser, cache & junk cleaner, and portable patch manager.
            
            - **Build Number**: ${{ github.run_number }}
            - **Target**: `generic/platform=iOS` (ARM64 Physical Device)
            - **TrollStore Ready**: Pre-configured with `com.apple.private.security.no-sandbox` entitlements
            - **Compatible Sideloaders**: TrollStore, AltStore, Sideloadly, ESign, KSign
          files: ${{ runner.temp }}/WangJinTool-Unsigned.ipa
          draft: false
          prerelease: false
